[workspace]
members = ["trw"]

[package]
name = "token-runway"
version = "0.5.0"
description = "AI 코딩 어시스턴트 세션 소진 경보 앱"
authors = ["tienne"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "token_runway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# 완료 알림의 클릭 응답용. tauri-plugin-notification은 데스크톱에서 클릭을 버린다.
# notify-rust가 이미 의존으로 갖고 있어 crate가 늘지 않는다.
mac-notification-sys = "0.6"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
sys-locale = "0.3"
tauri-plugin-updater = "2"
