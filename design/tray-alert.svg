  <path d="M28 41 L23 25" stroke="#FF453A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 중앙 점선 (위로 갈수록 작게 — 원근) -->
  <rect x="21.4" y="26" width="1.2" height="2.0" rx="0.6" fill="#FF453A"/>
  <rect x="21.2" y="30" width="1.6" height="2.6" rx="0.8" fill="#FF453A"/>
  <rect x="20.9" y="35.5" width="2.2" height="3.0" rx="1.0" fill="#FF453A"/>

