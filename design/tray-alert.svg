<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 위험(잔여 임박) — 빨강. set_icon_as_template(false)로 컬러 그대로 표시 -->
  <!-- Token Runway — 착륙하는 비행기 + 활주로 -->

  <!-- 활주로: 원근으로 수렴하는 양쪽 가장자리 -->
